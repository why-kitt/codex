name: Build patched Windows x64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "openai/codex tag to build (empty = latest release)"
        required: false
        default: ""
      publish_release:
        description: "Publish a patched-<tag> release on this repository"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: build-windows-x64
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build codex.exe
    runs-on: windows-latest
    # Whole-job budget: 7 min setup + 170 min build + ~15 min smoke/package/
    # upload/release/cache-save. Must stay well above those or a successful
    # build gets killed during artifact upload.
    timeout-minutes: 240
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh api repos/openai/codex/releases/latest --jq '.tag_name')"
          fi
          commit="$(git ls-remote https://github.com/openai/codex.git "refs/tags/${tag}" | cut -f1)"
          if [ -z "${commit}" ]; then
            echo "unknown openai/codex tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "asset=codex-${tag}-windows-x64" >> "${GITHUB_OUTPUT}"
          echo "Building openai/codex @ ${tag} (${commit})"

      - name: Checkout openai/codex
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ steps.resolve.outputs.tag }}
          path: codex-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patches
        shell: bash
        run: python scripts/apply_patches.py --root codex-src

      - name: Record patched diff
        shell: bash
        run: |
          set -euo pipefail
          git -C codex-src diff > "${{ steps.resolve.outputs.asset }}.patch"
          echo "patched files:"
          git -C codex-src --no-pager diff --stat

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Refresh Cargo.lock for the release tag
        shell: bash
        run: |
          set -euo pipefail
          # Upstream tags ship Cargo.lock with workspace members at 0.0.0 while the
          # tag's Cargo.toml already carries the release version, so a --locked build
          # refuses to start. Re-resolve once (member version lines only), then the
          # build itself stays --locked.
          cd codex-src/codex-rs
          cargo metadata --format-version 1 > /dev/null
          cd ../..
          changed="$(git --no-pager diff --unified=0 -- codex-src/codex-rs/Cargo.lock \
            | grep -E '^[+-][^+-]' || true)"
          unexpected="$(printf '%s\n' "${changed}" | grep -vE '^[+-]version = "[^"]*"$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "unexpected Cargo.lock delta, refusing to build:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          echo "Cargo.lock refresh delta:"
          git --no-pager diff --stat -- codex-src/codex-rs/Cargo.lock

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-src/codex-rs -> target
          key: ${{ steps.resolve.outputs.tag }}
          # Save even on failure/timeout so a truncated build resumes from
          # the partial cache on the next run instead of starting cold.
          save-always: true

      - name: Print runner specs
        shell: pwsh
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "CPU: $($cpu.Name) x$($computer.NumberOfLogicalProcessors)"
          Write-Host "Total RAM: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 1)) GiB"
          Get-PSDrive -PSProvider FileSystem |
            Format-Table -AutoSize Name, @{n = "Free(GB)"; e = { [math]::Round($_.Free / 1GB, 1) }} |
            Out-String | Write-Host

      - name: Exclude build dirs from Windows Defender
        shell: pwsh
        run: |
          # Real-time scanning of the cargo registry and target tree makes
          # release links crawl on hosted Windows runners.
          $paths = @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:RUNNER_TEMP")
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Write-Host "Defender exclusions added: $($paths -join ', ')"
          } catch {
            Write-Host "Could not add Defender exclusions (continuing): $_"
          }

      - name: Use rust-lld linker (matches upstream release workflow)
        shell: pwsh
        run: |
          # openai/codex rust-release-windows.yml sets
          # CARGO_TARGET_*_LINKER to rust-lld; MSVC link.exe is far slower on
          # the 200MB static-CRT codex.exe and can appear to hang for hours.
          $sysroot = (rustc --print sysroot).Trim()
          $hostTriple = ((rustc -vV | Select-String '^host: ').Line.Substring(6)).Trim()
          $lld = Join-Path $sysroot "lib\rustlib\$hostTriple\bin\rust-lld.exe"
          if (-not (Test-Path $lld)) { throw "rust-lld.exe not found at $lld" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using linker: $lld"

      - name: Build codex.exe
        shell: pwsh
        # Fail loudly on a hung build well before the job-level 240-minute cap.
        # Expected duration with LTO off: ~100-110 min (worst observed ~145);
        # rustc_cpu_s heartbeat flags a real stall within minutes.
        timeout-minutes: 170
        working-directory: codex-src/codex-rs
        env:
          STABLE_GIT_COMMIT: ${{ steps.resolve.outputs.commit }}
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
          # The final codex-cli crate runs thin LTO over the whole workspace,
          # which is the phase that starved the 4-core hosted runner for hours.
          # Drop it for CI: much faster links, slightly slower binary. Delete
          # this line to match the upstream release profile exactly.
          CARGO_PROFILE_RELEASE_LTO: "off"
        run: |
          # Heartbeat: a child pwsh writing straight to this step's stdout, so the
          # log keeps moving even when cargo itself goes quiet for a long time.
          # The loop lives in a script file to avoid Start-Process quoting issues.
          $beatScript = Join-Path $env:RUNNER_TEMP "heartbeat.ps1"
          $beatBody = @'
          while ($true) {
            $os = Get-CimInstance Win32_OperatingSystem
            $ram = [math]::Round($os.FreePhysicalMemory / 1024)
            $rustc = @(Get-Process rustc -ErrorAction SilentlyContinue)
            $link = @(Get-Process link, rust-lld -ErrorAction SilentlyContinue).Count
            $cpu = [math]::Round(($rustc | Measure-Object -Property CPU -Sum).Sum, 1)
            Write-Output ("[heartbeat {0}] ram_free_mb={1} rustc={2} rustc_cpu_s={3} link={4}" -f (Get-Date -Format s), $ram, $rustc.Count, $cpu, $link)
            Start-Sleep 300
          }
          '@
          Set-Content -Path $beatScript -Value $beatBody
          $beat = Start-Process pwsh -ArgumentList @("-NoProfile", "-File", $beatScript) -PassThru -NoNewWindow
          try {
            cargo build --release --locked -p codex-cli --bin codex
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $beat.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test codex.exe
        shell: pwsh
        working-directory: codex-src/codex-rs
        run: ./target/release/codex.exe --version

      - name: Package artifacts
        id: package
        shell: pwsh
        run: |
          $name = "${{ steps.resolve.outputs.asset }}"
          Copy-Item "codex-src/codex-rs/target/release/codex.exe" "$name.exe"
          Compress-Archive -Path "$name.exe" -DestinationPath "$name.zip" -Force
          Get-Item "$name.exe", "$name.zip", "$name.patch" |
            Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) }} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64
          path: |
            ${{ steps.resolve.outputs.asset }}.zip
            ${{ steps.resolve.outputs.asset }}.patch
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="patched-${{ steps.resolve.outputs.tag }}"
          zip="${{ steps.resolve.outputs.asset }}.zip"
          patch="${{ steps.resolve.outputs.asset }}.patch"
          notes="Patched build of openai/codex ${{ steps.resolve.outputs.tag }} (commit ${{ steps.resolve.outputs.commit }}).

          Adds the [reconnect] config table (mode = default | fixed, interval_ms, max_retries),
          raises the stream_max_retries hard cap to 10000, and adds the TUI /reconnect command."
          if gh release view "${release}" >/dev/null 2>&1; then
            gh release upload "${release}" "${zip}" "${patch}" --clobber
          else
            gh release create "${release}" "${zip}" "${patch}" \
              --title "${release}" \
              --notes "${notes}"
          fi
